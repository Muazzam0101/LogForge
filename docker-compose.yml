services:
  mysql:
    image: mysql:8.0
    container_name: logforge-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: logforge
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - logforge-network

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: logforge-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=logforge-cluster
      - node.name=logforge-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - logforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logforge-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:@mysql:3306/logforge
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "logforge-events"
      OPENSEARCH_BULK_SIZE: "500"
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - logforge-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ULPF_API_URL: http://localhost:8000
    container_name: logforge-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ULPF_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - logforge-network

volumes:
  mysql_data:
    driver: local
  opensearch_data:
    driver: local

networks:
  logforge-network:
    driver: bridge
