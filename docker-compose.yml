services:
  mysql:
    image: mysql:8.0
    container_name: logforge-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: logforge
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - logforge-network

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: logforge-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=logforge-cluster
      - node.name=logforge-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - logforge-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: logforge-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - logforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logforge-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:@mysql:3306/logforge
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "logforge-events"
      OPENSEARCH_BULK_SIZE: "500"
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_LOG_TOPIC: "logforge.raw-events"
      KAFKA_DLQ_TOPIC: "logforge.dead-letter"
      KAFKA_CONSUMER_GROUP: "logforge-ulpf-workers"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - logforge-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logforge-worker
    command: python -m app.streaming.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:@mysql:3306/logforge
      DEBUG: "False"
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "logforge-events"
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_LOG_TOPIC: "logforge.raw-events"
      KAFKA_DLQ_TOPIC: "logforge.dead-letter"
      KAFKA_CONSUMER_GROUP: "logforge-ulpf-workers"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - logforge-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ULPF_API_URL: http://localhost:8000
    container_name: logforge-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ULPF_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - logforge-network

volumes:
  mysql_data:
    driver: local
  opensearch_data:
    driver: local
  kafka_data:
    driver: local

networks:
  logforge-network:
    driver: bridge

